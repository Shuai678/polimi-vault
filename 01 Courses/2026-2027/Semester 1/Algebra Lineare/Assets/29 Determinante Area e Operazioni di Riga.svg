<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="titolo descrizione"><title id="titolo">Determinante area e operazioni di riga</title><desc id="descrizione">Tre parallelogrammi in scala con area quattro: quello delle colonne di A, quello dopo sommare la seconda riga alla prima e quello dopo scambiare le righe. I determinanti sono quattro quattro e meno quattro.</desc><defs><marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1040" height="510" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="38" font-size="24" font-weight="700" fill="#0f172a">Stessa area, orientazione conservata oppure invertita</text><text x="25" y="74" font-size="18" fill="#475569">Le due colonne sono vettori u e v. Stessa unità su entrambi gli assi e nei tre pannelli.</text><g transform="translate(20 101)" data-panel="0"><rect width="320" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="30" text-anchor="middle" fill="#334155" font-size="19" font-weight="700">Originale A</text><path d="M80 105V245" stroke="#e2e8f0" fill="none"/><path d="M120 105V245" stroke="#e2e8f0" fill="none"/><path d="M160 105V245" stroke="#e2e8f0" fill="none"/><path d="M200 105V245" stroke="#e2e8f0" fill="none"/><path d="M240 105V245" stroke="#e2e8f0" fill="none"/><path d="M40 205H260" stroke="#e2e8f0" fill="none"/><path d="M40 165H260" stroke="#e2e8f0" fill="none"/><path d="M40 125H260" stroke="#e2e8f0" fill="none"/><path d="M31 245H278 M40 254V96" stroke="#64748b" fill="none" stroke-width="1.3" marker-end="url(#freccia)"/><text x="279" y="263" fill="#64748b" font-size="16">x</text><text x="26" y="96" fill="#64748b" font-size="16">y</text><text x="25" y="263" fill="#64748b" font-size="15">0</text><polygon points="40,245 120,245 160,165 80,165" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2" data-first="2,0" data-second="1,2" data-determinant="4"/><path d="M40 245L120 245" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#freccia)"/><path d="M40 245L80 165" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#freccia)"/><text x="127" y="235" fill="#1d4ed8" font-size="18">u</text><text x="87" y="155" fill="#b45309" font-size="18">v</text><text x="160" y="305" text-anchor="middle" fill="#1e40af" font-size="24" font-weight="700">det = 4</text></g><g transform="translate(360 101)" data-panel="1"><rect width="320" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="30" text-anchor="middle" fill="#334155" font-size="19" font-weight="700">R₁ ← R₁ + R₂</text><path d="M80 105V245" stroke="#e2e8f0" fill="none"/><path d="M120 105V245" stroke="#e2e8f0" fill="none"/><path d="M160 105V245" stroke="#e2e8f0" fill="none"/><path d="M200 105V245" stroke="#e2e8f0" fill="none"/><path d="M240 105V245" stroke="#e2e8f0" fill="none"/><path d="M40 205H260" stroke="#e2e8f0" fill="none"/><path d="M40 165H260" stroke="#e2e8f0" fill="none"/><path d="M40 125H260" stroke="#e2e8f0" fill="none"/><path d="M31 245H278 M40 254V96" stroke="#64748b" fill="none" stroke-width="1.3" marker-end="url(#freccia)"/><text x="279" y="263" fill="#64748b" font-size="16">x</text><text x="26" y="96" fill="#64748b" font-size="16">y</text><text x="25" y="263" fill="#64748b" font-size="15">0</text><polygon points="40,245 120,245 240,165 160,165" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2" data-first="2,0" data-second="3,2" data-determinant="4"/><path d="M40 245L120 245" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#freccia)"/><path d="M40 245L160 165" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#freccia)"/><text x="127" y="235" fill="#1d4ed8" font-size="18">u</text><text x="167" y="155" fill="#b45309" font-size="18">v</text><text x="160" y="305" text-anchor="middle" fill="#1e40af" font-size="24" font-weight="700">det = 4</text></g><g transform="translate(700 101)" data-panel="2"><rect width="320" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="30" text-anchor="middle" fill="#334155" font-size="19" font-weight="700">Scambio R₁ ↔ R₂</text><path d="M80 105V245" stroke="#e2e8f0" fill="none"/><path d="M120 105V245" stroke="#e2e8f0" fill="none"/><path d="M160 105V245" stroke="#e2e8f0" fill="none"/><path d="M200 105V245" stroke="#e2e8f0" fill="none"/><path d="M240 105V245" stroke="#e2e8f0" fill="none"/><path d="M40 205H260" stroke="#e2e8f0" fill="none"/><path d="M40 165H260" stroke="#e2e8f0" fill="none"/><path d="M40 125H260" stroke="#e2e8f0" fill="none"/><path d="M31 245H278 M40 254V96" stroke="#64748b" fill="none" stroke-width="1.3" marker-end="url(#freccia)"/><text x="279" y="263" fill="#64748b" font-size="16">x</text><text x="26" y="96" fill="#64748b" font-size="16">y</text><text x="25" y="263" fill="#64748b" font-size="15">0</text><polygon points="40,245 40,165 120,125 120,205" fill="#ffedd5" stroke="#fdba74" stroke-width="1.2" data-first="0,2" data-second="2,1" data-determinant="-4"/><path d="M40 245L40 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#freccia)"/><path d="M40 245L120 205" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#freccia)"/><text x="47" y="155" fill="#1d4ed8" font-size="18">u</text><text x="127" y="195" fill="#b45309" font-size="18">v</text><text x="160" y="305" text-anchor="middle" fill="#9a3412" font-size="24" font-weight="700">det = -4</text></g><text x="25" y="468" fill="#334155" font-size="17">L'area è 4 in tutti i pannelli. Il segno del determinante registra l'orientazione della coppia (u, v).</text><text x="25" y="496" fill="#64748b" font-size="15">Interpretazione geometrica del tutor per matrici reali 2 × 2; non sostituisce la dimostrazione algebrica.</text></g></svg>
