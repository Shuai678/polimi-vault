<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="575" viewBox="0 0 1040 575" role="img" aria-labelledby="title desc"><title id="title">Span di una retta e del piano</title><desc id="desc">Confronto in scala fra due vettori collineari e due direzioni indipendenti del piano reale.</desc><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5b697c"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2166b1"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#d77917"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#008568"/></marker><marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8957b1"/></marker></defs><rect width="1040" height="575" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="36" font-size="25" fill="#25364a" >Span: contano le direzioni, non il numero di frecce</text><rect x="20" y="62" width="490" height="458" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="38" y="95" font-size="20" fill="#25364a" >Due vettori collineari: una retta</text><line x1="116" y1="433" x2="116" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="99" y1="433" x2="405" y2="433" stroke="#e0e6ee" stroke-width="1" /><line x1="184" y1="433" x2="184" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="99" y1="365" x2="405" y2="365" stroke="#e0e6ee" stroke-width="1" /><line x1="252" y1="433" x2="252" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="99" y1="297" x2="405" y2="297" stroke="#e0e6ee" stroke-width="1" /><line x1="320" y1="433" x2="320" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="99" y1="229" x2="405" y2="229" stroke="#e0e6ee" stroke-width="1" /><line x1="388" y1="433" x2="388" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="99" y1="161" x2="405" y2="161" stroke="#e0e6ee" stroke-width="1" /><line x1="95.6" y1="365" x2="422" y2="365" stroke="#5b697c" stroke-width="1.4" marker-end="url(#axis)"/><line x1="184" y1="433" x2="184" y2="133.8" stroke="#5b697c" stroke-width="1.4" marker-end="url(#axis)"/><text x="429" y="370" font-size="14" fill="#25364a" >x</text><text x="191" y="133.8" font-size="14" fill="#25364a" >y</text><text x="165" y="385" font-size="14" fill="#25364a" >O</text><text x="248" y="385" font-size="12" fill="#25364a" >1</text><text x="164" y="301" font-size="12" fill="#25364a" >1</text><text x="316" y="385" font-size="12" fill="#25364a" >2</text><text x="164" y="233" font-size="12" fill="#25364a" >2</text><text x="384" y="385" font-size="12" fill="#25364a" >3</text><text x="164" y="165" font-size="12" fill="#25364a" >3</text><line x1="116" y1="433" x2="401.6" y2="147.39999999999998" stroke="#2166b1" stroke-width="2" /><line x1="184" y1="365" x2="320" y2="229" stroke="#d77917" stroke-width="3.4" marker-end="url(#orange)" stroke-dasharray="7 5"/><line x1="184" y1="365" x2="252" y2="297" stroke="#2166b1" stroke-width="3" marker-end="url(#blue)" /><text x="204" y="286" font-size="16" fill="#2166b1" >v = (1, 1)</text><text x="326" y="223" font-size="16" fill="#d77917" >2v = (2, 2)</text><text x="38" y="468" font-size="19" fill="#25364a" >Span(v, 2v) = Span(v)</text><text x="38" y="499" font-size="17" fill="#25364a" >Solo multipli di (1, 1): y = x</text><rect x="530" y="62" width="490" height="458" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="548" y="95" font-size="20" fill="#25364a" >Due direzioni indipendenti: il piano</text><rect x="609" y="147.39999999999998" width="306" height="285.6" fill="#e8f2fa"/><line x1="626" y1="433" x2="626" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="609" y1="433" x2="915" y2="433" stroke="#e0e6ee" stroke-width="1" /><line x1="694" y1="433" x2="694" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="609" y1="365" x2="915" y2="365" stroke="#e0e6ee" stroke-width="1" /><line x1="762" y1="433" x2="762" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="609" y1="297" x2="915" y2="297" stroke="#e0e6ee" stroke-width="1" /><line x1="830" y1="433" x2="830" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="609" y1="229" x2="915" y2="229" stroke="#e0e6ee" stroke-width="1" /><line x1="898" y1="433" x2="898" y2="147.39999999999998" stroke="#e0e6ee" stroke-width="1" /><line x1="609" y1="161" x2="915" y2="161" stroke="#e0e6ee" stroke-width="1" /><line x1="605.6" y1="365" x2="932" y2="365" stroke="#5b697c" stroke-width="1.4" marker-end="url(#axis)"/><line x1="694" y1="433" x2="694" y2="133.8" stroke="#5b697c" stroke-width="1.4" marker-end="url(#axis)"/><text x="939" y="370" font-size="14" fill="#25364a" >x</text><text x="701" y="133.8" font-size="14" fill="#25364a" >y</text><text x="675" y="385" font-size="14" fill="#25364a" >O</text><text x="758" y="385" font-size="12" fill="#25364a" >1</text><text x="674" y="301" font-size="12" fill="#25364a" >1</text><text x="826" y="385" font-size="12" fill="#25364a" >2</text><text x="674" y="233" font-size="12" fill="#25364a" >2</text><text x="894" y="385" font-size="12" fill="#25364a" >3</text><text x="674" y="165" font-size="12" fill="#25364a" >3</text><line x1="694" y1="365" x2="762" y2="365" stroke="#2166b1" stroke-width="3" marker-end="url(#blue)" /><line x1="694" y1="365" x2="694" y2="297" stroke="#d77917" stroke-width="3" marker-end="url(#orange)" /><line x1="762" y1="365" x2="830" y2="365" stroke="#2166b1" stroke-width="2" stroke-dasharray="5 4"/><line x1="830" y1="365" x2="830" y2="297" stroke="#d77917" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="297" x2="830" y2="297" stroke="#8fa2b5" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="694" y1="365" x2="830" y2="297" stroke="#008568" stroke-width="3" marker-end="url(#green)" /><circle cx="830" cy="297" r="4" fill="#008568" data-point="2,1"/><text x="755" y="395" font-size="17" fill="#2166b1" >v₁</text><text x="665" y="285" font-size="17" fill="#d77917" >v₂</text><text x="844" y="292" font-size="17" fill="#008568" >(2, 1)</text><text x="548" y="468" font-size="19" fill="#25364a" >Span(v₁, v₂) = ℝ²</text><text x="548" y="499" font-size="17" fill="#25364a" >(x, y) = xv₁ + yv₂</text><text x="28" y="550" font-size="15" fill="#25364a" >Figura del tutor in scala. Le rette e il piano proseguono oltre la finestra rappresentata.</text></g></svg>
