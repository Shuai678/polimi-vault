<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="titolo descrizione"><title id="titolo">Il prodotto righe per colonne</title><desc id="descrizione">Seconda riga della matrice A, tre e quattro, moltiplicata per la terza colonna di B, meno uno e due: il risultato è cinque nella posizione due tre di AB.</desc><defs><marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#0f172a">Un'entrata del prodotto: riga 2 per colonna 3</text><text x="30" y="76" font-size="19" fill="#475569">(2 × 2) · (2 × 3) → (2 × 3)</text><text x="145" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">A</text><rect x="65" y="162" width="80" height="72" fill="#f8fafc"/><text x="105" y="208" text-anchor="middle" font-size="28" fill="#0f172a">1</text><rect x="145" y="162" width="80" height="72" fill="#f8fafc"/><text x="185" y="208" text-anchor="middle" font-size="28" fill="#0f172a">2</text><rect x="65" y="234" width="80" height="72" fill="#dbeafe"/><text x="105" y="280" text-anchor="middle" font-size="28" fill="#0f172a">3</text><rect x="145" y="234" width="80" height="72" fill="#dbeafe"/><text x="185" y="280" text-anchor="middle" font-size="28" fill="#0f172a">4</text><path d="M57 157H47V311H57 M233 157H243V311H233" fill="none" stroke="#334155" stroke-width="2.5"/><text x="465" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">B</text><rect x="360" y="162" width="70" height="72" fill="#f8fafc"/><text x="395" y="208" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="430" y="162" width="70" height="72" fill="#f8fafc"/><text x="465" y="208" text-anchor="middle" font-size="28" fill="#0f172a">1</text><rect x="500" y="162" width="70" height="72" fill="#fed7aa"/><text x="535" y="208" text-anchor="middle" font-size="28" fill="#0f172a">-1</text><rect x="360" y="234" width="70" height="72" fill="#f8fafc"/><text x="395" y="280" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="430" y="234" width="70" height="72" fill="#f8fafc"/><text x="465" y="280" text-anchor="middle" font-size="28" fill="#0f172a">-1</text><rect x="500" y="234" width="70" height="72" fill="#fed7aa"/><text x="535" y="280" text-anchor="middle" font-size="28" fill="#0f172a">2</text><path d="M352 157H342V311H352 M578 157H588V311H578" fill="none" stroke="#334155" stroke-width="2.5"/><text x="842.5" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">C = AB</text><rect x="745" y="162" width="65" height="72" fill="#f8fafc"/><text x="777.5" y="208" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="810" y="162" width="65" height="72" fill="#f8fafc"/><text x="842.5" y="208" text-anchor="middle" font-size="28" fill="#0f172a">-1</text><rect x="875" y="162" width="65" height="72" fill="#f8fafc"/><text x="907.5" y="208" text-anchor="middle" font-size="28" fill="#0f172a">3</text><rect x="745" y="234" width="65" height="72" fill="#f8fafc"/><text x="777.5" y="280" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="810" y="234" width="65" height="72" fill="#f8fafc"/><text x="842.5" y="280" text-anchor="middle" font-size="28" fill="#0f172a">-1</text><rect x="875" y="234" width="65" height="72" fill="#bbf7d0"/><text x="907.5" y="280" text-anchor="middle" font-size="28" fill="#0f172a">5</text><path d="M737 157H727V311H737 M948 157H958V311H948" fill="none" stroke="#334155" stroke-width="2.5"/><text x="277" y="248" font-size="33" fill="#475569">×</text><text x="657" y="248" font-size="33" fill="#475569">=</text><text x="30" y="367" font-size="22" fill="#1e40af">c₂₃ = 3 · (−1) + 4 · 2 = −3 + 8 = 5</text><text x="30" y="411" font-size="18" fill="#475569">Due addendi per ogni entrata; due righe e tre colonne nel risultato.</text><text x="30" y="448" font-size="15" fill="#64748b">Schema di posizioni nella tabella: i colori collegano la riga, la colonna e l'entrata ottenuta.</text></g></svg>
