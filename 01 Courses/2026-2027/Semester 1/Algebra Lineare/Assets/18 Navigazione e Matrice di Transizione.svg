<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="titolo descrizione"><title id="titolo">Navigazione fra tre pagine e matrice di transizione</title><desc id="descrizione">Dalla pagina uno si passa alla due o alla tre con probabilità un mezzo. Dalla due alla uno e dalla tre alla due con probabilità uno. Le colonne della matrice indicano la partenza e le righe l'arrivo.</desc><defs><marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="490" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="40" font-size="25" font-weight="700" fill="#0f172a">Dal grafo alla matrice di transizione T</text><text x="28" y="75" font-size="18" fill="#475569">Le probabilità in uscita da ciascuna pagina sommano a 1.</text><rect x="24" y="105" width="425" height="308" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><rect x="480" y="105" width="496" height="308" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><path d="M201 177 Q130 240 95 338" fill="none" stroke="#2563eb" stroke-width="2.8" marker-end="url(#freccia)"/><text x="116" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" stroke="#f8fafc" stroke-width="5" paint-order="stroke">1/2</text><path d="M105 343 Q170 285 214 185" fill="none" stroke="#2563eb" stroke-width="2.8" marker-end="url(#freccia)"/><text x="184" y="289" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" stroke="#f8fafc" stroke-width="5" paint-order="stroke">1</text><path d="M239 177 L346 338" fill="none" stroke="#2563eb" stroke-width="2.8" marker-end="url(#freccia)"/><text x="320" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" stroke="#f8fafc" stroke-width="5" paint-order="stroke">1/2</text><path d="M335 365 H115" fill="none" stroke="#2563eb" stroke-width="2.8" marker-end="url(#freccia)"/><text x="220" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" stroke="#f8fafc" stroke-width="5" paint-order="stroke">1</text><circle cx="220" cy="155" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="220" y="163" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af">1</text><circle cx="85" cy="365" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="85" y="373" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af">2</text><circle cx="365" cy="365" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365" y="373" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af">3</text><text x="733" y="139" text-anchor="middle" font-size="19" fill="#334155">colonne: partenza j</text><text x="510" y="179" font-size="16" fill="#475569">arrivo i</text><text x="640" y="181" text-anchor="middle" font-size="17" fill="#64748b">j = 1</text><text x="735" y="181" text-anchor="middle" font-size="17" fill="#64748b">j = 2</text><text x="830" y="181" text-anchor="middle" font-size="17" fill="#64748b">j = 3</text><text x="571" y="238" text-anchor="middle" font-size="17" fill="#64748b">i = 1</text><text x="640" y="240" text-anchor="middle" font-size="26" fill="#0f172a">0</text><text x="735" y="240" text-anchor="middle" font-size="26" fill="#0f172a">1</text><text x="830" y="240" text-anchor="middle" font-size="26" fill="#0f172a">0</text><text x="571" y="300" text-anchor="middle" font-size="17" fill="#64748b">i = 2</text><text x="640" y="302" text-anchor="middle" font-size="26" fill="#0f172a">1/2</text><text x="735" y="302" text-anchor="middle" font-size="26" fill="#0f172a">0</text><text x="830" y="302" text-anchor="middle" font-size="26" fill="#0f172a">1</text><text x="571" y="362" text-anchor="middle" font-size="17" fill="#64748b">i = 3</text><text x="640" y="364" text-anchor="middle" font-size="26" fill="#0f172a">1/2</text><text x="735" y="364" text-anchor="middle" font-size="26" fill="#0f172a">0</text><text x="830" y="364" text-anchor="middle" font-size="26" fill="#0f172a">0</text><path d="M603 202H590V379H603 M867 202H880V379H867" fill="none" stroke="#334155" stroke-width="2.5"/><text x="28" y="449" font-size="17" fill="#334155">Esempio: t₁₂ = 1 significa partenza dalla pagina 2 e arrivo nella pagina 1.</text><text x="28" y="477" font-size="15" fill="#64748b">Il grafo è schematico; la posizione dei nodi non rappresenta distanze.</text></g></svg>
