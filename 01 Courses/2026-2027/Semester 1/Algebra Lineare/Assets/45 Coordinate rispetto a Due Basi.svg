 2b₁ + b₂</text><text x="548" y="498" font-size="19" fill="#25364a" >[v]B = (2, 1)</text><line x1="637" y1="332" x2="862" y2="257" stroke="#008568" stroke-width="3.4" marker-end="url(#green)" /><text x="874" y="249" font-size="17" fill="#008568" >v = (3, 1)</text><text x="28" y="550" font-size="15" fill="#25364a" >Figura del tutor in scala. La freccia verde non cambia: cambiano le direzioni e i coefficienti.</text></g></svg>
