<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="575" viewBox="0 0 1040 575" role="img" aria-labelledby="title desc"><title id="title">Coordinate rispetto a due basi</title><desc id="desc">Lo stesso vettore reale tre uno è tre e uno nella base canonica e due e uno nella base uno uno e uno meno uno.</desc><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5b697c"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2166b1"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#d77917"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#008568"/></marker><marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8957b1"/></marker></defs><rect width="1040" height="575" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="36" font-size="25" fill="#25364a" >Lo stesso vettore, coordinate rispetto a basi diverse</text><rect x="20" y="62" width="490" height="458" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="38" y="95" font-size="21" fill="#25364a" >Base canonica E = (e₁, e₂)</text><line x1="52" y1="429.5" x2="52" y2="152" stroke="#e0e6ee" stroke-width="1" /><line x1="127" y1="429.5" x2="127" y2="152" stroke="#e0e6ee" stroke-width="1" /><line x1="202" y1="429.5" x2="202" y2="152" stroke="#e0e6ee" stroke-width="1" /><line x1="277" y1="429.5" x2="277" y2="152" stroke="#e0e6ee" stroke-width="1" /><line x1="352" y1="429.5" x2="352" y2="152" stroke="#e0e6ee" stroke-width="1" /><line x1="427" y1="429.5" x2="427" y2="152" stroke="#e0e6ee" stroke-width="1" /><line x1="82" y1="407" x2="427" y2="407" stroke="#e0e6ee" stroke-width="1" /><line x1="82" y1="332" x2="427" y2="332" stroke="#e0e6ee" stroke-width="1" /><line x1="82" y1="257" x2="427" y2="257" stroke="#e0e6ee" stroke-width="1" /><line x1="82" y1="182" x2="427" y2="182" stroke="#e0e6ee" stroke-width="1" /><line x1="82" y1="332" x2="442" y2="332" stroke="#5b697c" stroke-width="1.4" marker-end="url(#axis)"/><line x1="127" y1="429.5" x2="127" y2="137" stroke="#5b697c" stroke-width="1.4" marker-end="url(#axis)"/><text x="448" y="337" font-size="14" fill="#25364a" >x</text><text x="134" y="137" font-size="14" fill="#25364a" >y</text><text x="108" y="352" font-size="14" fill="#25364a" >O</text><text x="198" y="352" font-size="12" fill="#25364a" >1</text><text x="273" y="352" font-size="12" fill="#25364a" >2</text><text x="348" y="352" font-size="12" fill="#25364a" >3</text><line x1="127" y1="332" x2="202" y2="332" stroke="#2166b1" stroke-width="3" marker-end="url(#blue)" /><line x1="127" y1="332" x2="127" y2="257" stroke="#d77917" stroke-width="3" marker-end="url(#orange)" /><line x1="202" y1="332" x2="352" y2="332" stroke="#2166b1" stroke-width="2" stroke-dasharray="5 4"/><line x1="352" y1="332" x2="352" y2="257" stroke="#d77917" stroke-width="2" stroke-dasharray="5 4"/><line x1="127" y1="257" x2="352" y2="257" stroke="#aab6c2" stroke-width="1.3" stroke-dasharray="4 4"/><text x="177" y="365" font-size="16" fill="#2166b1" >e₁</text><text x="98" y="245" font-size="16" fill="#d77917" >e₂</text><text x="38" y="466" font-size="20" fill="#25364a" >v = 3e₁ + e₂</text><text x="38" y="498" font-size="19" fill="#25364a" >[v]E = (3, 1)</text><line x1="127" y1="332" x2="352" y2="257" stroke="#008568" stroke-width="3.4" marker-end="url(#green)" /><text x="364" y="249" font-size="17" fill="#008568" >v = (3, 1)</text><rect x="530" y="62" width="490" height="458" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="548" y="95" font-size="21" fill="#25364a" >Base B = (b₁, b₂)</text