<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">Sistemi lineari e intersezioni di rette</title><desc id="desc">Tre sistemi reali con una soluzione, infinite soluzioni oppure nessuna. Coordinate in scala.</desc><defs><marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526174"/></marker><clipPath id="clip0"><rect x="72" y="111" width="224" height="288"/></clipPath><clipPath id="clip1"><rect x="408" y="111" width="224" height="288"/></clipPath><clipPath id="clip2"><rect x="744" y="111" width="224" height="288"/></clipPath></defs><rect width="1040" height="580" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="35" font-size="25" fill="#26364a" >Sistemi lineari: tre modi di intersecare due rette</text><rect x="24" y="60" width="320" height="472" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="40" y="86" font-size="19" fill="#26364a" >Un solo punto</text><line x1="104" y1="111" x2="104" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="72" y1="335" x2="296" y2="335" stroke="#e0e6ee" stroke-width="1" /><line x1="168" y1="111" x2="168" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="72" y1="271" x2="296" y2="271" stroke="#e0e6ee" stroke-width="1" /><line x1="232" y1="111" x2="232" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="72" y1="207" x2="296" y2="207" stroke="#e0e6ee" stroke-width="1" /><line x1="296" y1="111" x2="296" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="72" y1="143" x2="296" y2="143" stroke="#e0e6ee" stroke-width="1" /><line x1="72" y1="271" x2="307" y2="271" stroke="#526174" stroke-width="1.3" marker-end="url(#axis)"/><line x1="168" y1="399" x2="168" y2="101" stroke="#526174" stroke-width="1.3" marker-end="url(#axis)"/><text x="311" y="276" font-size="14" fill="#26364a" >x</text><text x="175" y="101" font-size="14" fill="#26364a" >y</text><text x="152" y="289" font-size="13" fill="#26364a" >O</text><text x="228" y="289" font-size="12" fill="#26364a" >1</text><text x="151" y="211" font-size="12" fill="#26364a" >1</text><g clip-path="url(#clip0)"><line x1="72" y1="447" x2="296" y2="111" stroke="#2166b1" stroke-width="3" /><line x1="72" y1="-81" x2="296" y2="591" stroke="#d77917" stroke-width="3.3" /><circle cx="189.33333333333331" cy="271" r="5" fill="#008568" data-point="1/3,0"/></g><text x="198.33333333333331" y="259" font-size="14" fill="#008568" >(1/3, 0)</text><text x="40" y="434" font-size="17" fill="#2166b1" >3x − 2y = 1</text><text x="40" y="461" font-size="17" fill="#b86512" >6x + 2y = 2</text><text x="40" y="493" font-size="15" fill="#26364a" >r(A) = r([A | b]) = 2</text><text x="40" y="516" font-size="15" fill="#26364a" >Una soluzione</text><rect x="360" y="60" width="320" height="472" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="376" y="86" font-size="19" fill="#26364a" >Rette coincidenti</text><line x1="440" y1="111" x2="440" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="408" y1="335" x2="632" y2="335" stroke="#e0e6ee" stroke-width="1" /><line x1="504" y1="111" x2="504" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="408" y1="271" x2="632" y2="271" stroke="#e0e6ee" stroke-width="1" /><line x1="568" y1="111" x2="568" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="408" y1="207" x2="632" y2="207" stroke="#e0e6ee" stroke-width="1" /><line x1="632" y1="111" x2="632" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="408" y1="143" x2="632" y2="143" stroke="#e0e6ee" stroke-width="1" /><line x1="408" y1="271" x2="643" y2="271" stroke="#526174" stroke-width="1.3" marker-end="url(#axis)"/><line x1="504" y1="399" x2="504" y2="101" stroke="#526174" stroke-width="1.3" marker-end="url(#axis)"/><text x="647" y="276" font-size="14" fill="#26364a" >x</text><text x="511" y="101" font-size="14" fill="#26364a" >y</text><text x="488" y="289" font-size="13" fill="#26364a" >O</text><text x="564" y="289" font-size="12" fill="#26364a" >1</text><text x="487" y="211" font-size="12" fill="#26364a" >1</text><g clip-path="url(#clip1)"><line x1="408" y1="447" x2="632" y2="111" stroke="#2166b1" stroke-width="3" /><line x1="408" y1="447" x2="632" y2="111" stroke="#d77917" stroke-width="3.3" stroke-dasharray="9 7"/></g><text x="376" y="434" font-size="17" fill="#2166b1" >3x − 2y = 1</text><text x="376" y="461" font-size="17" fill="#b86512" >6x − 4y = 2</text><text x="376" y="493" font-size="15" fill="#26364a" >r(A) = r([A | b]) = 1</text><text x="376" y="516" font-size="15" fill="#26364a" >Un parametro libero</text><rect x="696" y="60" width="320" height="472" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="712" y="86" font-size="19" fill="#26364a" >Rette parallele distinte</text><line x1="776" y1="111" x2="776" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="744" y1="335" x2="968" y2="335" stroke="#e0e6ee" stroke-width="1" /><line x1="840" y1="111" x2="840" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="744" y1="271" x2="968" y2="271" stroke="#e0e6ee" stroke-width="1" /><line x1="904" y1="111" x2="904" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="744" y1="207" x2="968" y2="207" stroke="#e0e6ee" stroke-width="1" /><line x1="968" y1="111" x2="968" y2="399" stroke="#e0e6ee" stroke-width="1" /><line x1="744" y1="143" x2="968" y2="143" stroke="#e0e6ee" stroke-width="1" /><line x1="744" y1="271" x2="979" y2="271" stroke="#526174" stroke-width="1.3" marker-end="url(#axis)"/><line x1="840" y1="399" x2="840" y2="101" stroke="#526174" stroke-width="1.3" marker-end="url(#axis)"/><text x="983" y="276" font-size="14" fill="#26364a" >x</text><text x="847" y="101" font-size="14" fill="#26364a" >y</text><text x="824" y="289" font-size="13" fill="#26364a" >O</text><text x="900" y="289" font-size="12" fill="#26364a" >1</text><text x="823" y="211" font-size="12" fill="#26364a" >1</text><g clip-path="url(#clip2)"><line x1="744" y1="447" x2="968" y2="111" stroke="#2166b1" stroke-width="3" /><line x1="744" y1="479" x2="968" y2="143" stroke="#d77917" stroke-width="3.3" /></g><text x="712" y="434" font-size="17" fill="#2166b1" >3x − 2y = 1</text><text x="712" y="461" font-size="17" fill="#b86512" >6x − 4y = 4</text><text x="712" y="493" font-size="15" fill="#26364a" >r(A) = 1, r([A | b]) = 2</text><text x="712" y="516" font-size="15" fill="#26364a" >Nessuna soluzione</text><text x="28" y="558" font-size="15" fill="#26364a" >Figura del tutor. Stessa scala su entrambi gli assi; la linea arancione tratteggiata coincide con quella blu.</text></g></svg>
