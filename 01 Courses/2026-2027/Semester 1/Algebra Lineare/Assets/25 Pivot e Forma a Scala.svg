<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450" role="img" aria-labelledby="titolo descrizione"><title id="titolo">Pivot e matrice a scala</title><desc id="descrizione">Matrice tre per quattro con righe uno zero uno meno uno; zero zero meno uno sei; zero zero zero dodici. I pivot sono nelle colonne uno tre quattro, quindi il rango reale è tre.</desc><defs><marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="940" height="450" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="40" font-size="25" font-weight="700" fill="#0f172a">La scala segue i pivot, anche saltando colonne</text><text x="30" y="77" font-size="18" fill="#475569">Un pivot per ogni riga non nulla; le colonne dei pivot sono 1, 3 e 4.</text><text x="300" y="126" font-size="17" text-anchor="middle" fill="#64748b">col. 1</text><text x="400" y="126" font-size="17" text-anchor="middle" fill="#64748b">col. 2</text><text x="500" y="126" font-size="17" text-anchor="middle" fill="#64748b">col. 3</text><text x="600" y="126" font-size="17" text-anchor="middle" fill="#64748b">col. 4</text><rect x="250" y="142" width="100" height="68" fill="#ffffff"/><circle cx="300" cy="176" r="24" fill="#fecaca" data-row="1" data-column="1" data-pivot="1"/><text x="300" y="185" text-anchor="middle" font-size="28" fill="#0f172a">1</text><rect x="350" y="142" width="100" height="68" fill="#ffffff"/><text x="400" y="185" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="450" y="142" width="100" height="68" fill="#ffffff"/><text x="500" y="185" text-anchor="middle" font-size="28" fill="#0f172a">1</text><rect x="550" y="142" width="100" height="68" fill="#ffffff"/><text x="600" y="185" text-anchor="middle" font-size="28" fill="#0f172a">-1</text><text x="707" y="185" font-size="21" fill="#b91c1c">p1 = 1</text><rect x="250" y="210" width="100" height="68" fill="#f1f5f9"/><text x="300" y="253" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="350" y="210" width="100" height="68" fill="#f1f5f9"/><text x="400" y="253" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="450" y="210" width="100" height="68" fill="#ffffff"/><circle cx="500" cy="244" r="24" fill="#fecaca" data-row="2" data-column="3" data-pivot="-1"/><text x="500" y="253" text-anchor="middle" font-size="28" fill="#0f172a">-1</text><rect x="550" y="210" width="100" height="68" fill="#ffffff"/><text x="600" y="253" text-anchor="middle" font-size="28" fill="#0f172a">6</text><text x="707" y="253" font-size="21" fill="#b91c1c">p2 = -1</text><rect x="250" y="278" width="100" height="68" fill="#f1f5f9"/><text x="300" y="321" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="350" y="278" width="100" height="68" fill="#f1f5f9"/><text x="400" y="321" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="450" y="278" width="100" height="68" fill="#f1f5f9"/><text x="500" y="321" text-anchor="middle" font-size="28" fill="#0f172a">0</text><rect x="550" y="278" width="100" height="68" fill="#ffffff"/><circle cx="600" cy="312" r="24" fill="#fecaca" data-row="3" data-column="4" data-pivot="12"/><text x="600" y="321" text-anchor="middle" font-size="28" fill="#0f172a">12</text><text x="707" y="321" font-size="21" fill="#b91c1c">p3 = 12</text><path d="M240 136H228V352H240 M660 136H672V352H660" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M250 142V210H450V278H550V346" fill="none" stroke="#dc2626" stroke-width="3"/><text x="30" y="393" font-size="22" font-weight="700" fill="#334155">Tre pivot → rango 3, su R.</text><text x="30" y="431" font-size="16" fill="#64748b">Schema di una matrice 3 × 4: non è una figura in scala geometrica e non ha un determinante dell'intera matrice.</text></g></svg>
