<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc"><title id="title">Nucleo e traslazione delle soluzioni</title><desc id="desc">Retta del nucleo x meno y uguale zero e traslazione x meno y uguale due; differenza di soluzioni nel nucleo.</desc><defs><marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526174"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#008568"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#d77917"/></marker><clipPath id="plot"><rect x="85" y="115" width="400" height="335"/></clipPath></defs><rect width="1040" height="550" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="35" font-size="25" fill="#26364a" >Soluzioni = punto particolare + nucleo</text><line x1="90" y1="115" x2="90" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="150" y1="115" x2="150" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="210" y1="115" x2="210" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="270" y1="115" x2="270" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="330" y1="115" x2="330" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="390" y1="115" x2="390" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="450" y1="115" x2="450" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="450" x2="485" y2="450" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="390" x2="485" y2="390" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="330" x2="485" y2="330" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="270" x2="485" y2="270" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="210" x2="485" y2="210" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="150" x2="485" y2="150" stroke="#e5eaf0" stroke-width="1" /><line x1="85" y1="390" x2="510" y2="390" stroke="#526174" stroke-width="1.5" marker-end="url(#axis)"/><line x1="150" y1="450" x2="150" y2="92" stroke="#526174" stroke-width="1.5" marker-end="url(#axis)"/><text x="516" y="396" font-size="17" fill="#26364a" >x</text><text x="158" y="96" font-size="17" fill="#26364a" >y</text><text x="129" y="412" font-size="15" fill="#26364a" >O</text><text x="206" y="411" font-size="13" fill="#26364a" >1</text><text x="266" y="411" font-size="13" fill="#26364a" >2</text><text x="326" y="411" font-size="13" fill="#26364a" >3</text><text x="386" y="411" font-size="13" fill="#26364a" >4</text><text x="446" y="411" font-size="13" fill="#26364a" >5</text><text x="130" y="334" font-size="13" fill="#26364a" >1</text><text x="130" y="274" font-size="13" fill="#26364a" >2</text><text x="130" y="214" font-size="13" fill="#26364a" >3</text><text x="130" y="154" font-size="13" fill="#26364a" >4</text><g clip-path="url(#plot)"><line x1="30" y1="510" x2="510" y2="30" stroke="#2166b1" stroke-width="3" /><line x1="30" y1="630" x2="510" y2="150" stroke="#d77917" stroke-width="3" /></g><line x1="150" y1="390" x2="270" y2="390" stroke="#d77917" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#orange)"/><line x1="150" y1="390" x2="210" y2="330" stroke="#008568" stroke-width="3" marker-end="url(#green)"/><line x1="270" y1="390" x2="330" y2="330" stroke="#008568" stroke-width="3" marker-end="url(#green)"/><circle cx="270" cy="390" r="5" fill="#b86512" data-point="2,0"/><text x="268" y="430" font-size="16" fill="#b86512" >p = (2, 0)</text><circle cx="330" cy="330" r="5" fill="#b86512" data-point="3,1"/><text x="346" y="330" font-size="16" fill="#b86512" >q = (3, 1)</text><text x="190" y="310" font-size="16" fill="#008568" >h = (1, 1)</text><text x="304" y="372" font-size="16" fill="#008568" >q − p = h</text><text x="550" y="120" font-size="23" fill="#26364a" >A = (1  −1)</text><text x="550" y="165" font-size="21" fill="#2166b1" >Nucleo</text><text x="550" y="196" font-size="19" fill="#2166b1" >x − y = 0</text><text x="550" y="226" font-size="18" fill="#26364a" >ker(A) = { t(1, 1) : t ∈ ℝ }</text><text x="550" y="279" font-size="21" fill="#b86512" >Sistema non omogeneo</text><text x="550" y="310" font-size="19" fill="#b86512" >x − y = 2</text><text x="550" y="340" font-size="18" fill="#26364a" >S = { (2, 0) + t(1, 1) : t ∈ ℝ }</text><text x="550" y="393" font-size="18" fill="#26364a" >Ap = Aq = 2</text><text x="550" y="423" font-size="18" fill="#008568" >A(q − p) = 2 − 2 = 0</text><text x="28" y="498" font-size="18" fill="#26364a" >Le due rette hanno la stessa direzione. Solo il nucleo contiene l'origine.</text><text x="28" y="528" font-size="15" fill="#26364a" >Figura del tutor in scala: 60 unità grafiche per unità su entrambi gli assi.</text></g></svg>
