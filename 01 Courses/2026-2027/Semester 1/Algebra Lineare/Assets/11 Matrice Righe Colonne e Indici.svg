<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">Righe colonne ed entrate di una matrice due per tre</title>
<desc id="descrizione">La matrice ha prima riga uno due tre e seconda riga quattro cinque sei. La seconda riga è blu e la terza colonna è arancione. La loro intersezione contiene sei, che è l'entrata a con indici due e tre.</desc>
<defs><marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs>
<rect width="920" height="430" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="42" fill="#0f172a" font-size="25" font-weight="700">Due righe, tre colonne: A è di tipo 2 × 3</text>
<text x="32" y="76" fill="#475569" font-size="18">A(i, j) = aᵢⱼ: prima si sceglie la riga i, poi la colonna j.</text>
<text x="437" y="113" text-anchor="middle" fill="#b45309" font-size="18">colonne j</text>
<text x="327" y="145" text-anchor="middle" fill="#64748b" font-size="17">j = 1</text>
<text x="437" y="145" text-anchor="middle" fill="#64748b" font-size="17">j = 2</text>
<text x="547" y="145" text-anchor="middle" fill="#b45309" font-size="17" font-weight="700">j = 3</text>
<text x="72" y="235" fill="#2563eb" font-size="18">righe i</text>
<text x="233" y="212" text-anchor="end" fill="#64748b" font-size="17">i = 1</text>
<text x="233" y="292" text-anchor="end" fill="#2563eb" font-size="17" font-weight="700">i = 2</text>
<rect x="272" y="245" width="330" height="80" fill="#dbeafe"/>
<rect x="492" y="165" width="110" height="160" fill="#fef3c7" fill-opacity="0.8"/>
<rect x="492" y="245" width="110" height="80" fill="#fed7aa" stroke="#d97706" stroke-width="2"/>
<g fill="none" stroke="#cbd5e1"><path d="M382 165V325 M492 165V325 M272 245H602"/></g>
<path d="M262 157H249V333H262 M612 157H625V333H612" fill="none" stroke="#334155" stroke-width="3"/>
<g fill="#0f172a" font-size="27" text-anchor="middle">
<text x="327" y="214">1</text><text x="437" y="214">2</text><text x="547" y="214">3</text>
<text x="327" y="294">4</text><text x="437" y="294">5</text><text x="547" y="294" font-weight="700">6</text>
</g>
<path d="M634 285H666" stroke="#b45309" stroke-width="2" marker-end="url(#freccia)" fill="none"/>
<rect x="680" y="250" width="204" height="70" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
<text x="782" y="278" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">a₂₃ = A(2, 3) = 6</text>
<text x="782" y="303" text-anchor="middle" fill="#92400e" font-size="15">riga 2, colonna 3</text>
<text x="32" y="376" fill="#334155" font-size="17">Il primo indice aumenta dall'alto verso il basso; il secondo da sinistra a destra.</text>
<text x="32" y="408" fill="#64748b" font-size="16">Schema di indicizzazione di una tabella: i e j non sono le coordinate di un punto del piano.</text>
</g></svg>
