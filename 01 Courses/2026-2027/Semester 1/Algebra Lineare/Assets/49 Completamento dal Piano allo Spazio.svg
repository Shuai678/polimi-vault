<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc"><title id="title">Completamento dal piano allo spazio</title><desc id="desc">Due vettori indipendenti nel piano z uguale x più y si completano con la direzione canonica uno zero zero.</desc><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5b697c"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2166b1"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#d77917"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#008568"/></marker><marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8957b1"/></marker></defs><rect width="1040" height="600" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="36" font-size="25" fill="#25364a">Completare una base: aggiungere una direzione fuori dal piano</text><rect x="20" y="66" width="565" height="450" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><text x="46" y="105" font-size="21" fill="#357b65">Span(v₁, v₂): z = x + y</text><line x1="260" y1="350" x2="476" y2="428" stroke="#5b697c" stroke-width="1.4" data-from="0,0,0" data-to="3,0,0" marker-end="url(#axis)"/><text x="483" y="433" font-size="16" fill="#25364a">x</text><line x1="260" y1="350" x2="125.60000000000002" y2="420" stroke="#5b697c" stroke-width="1.4" data-from="0,0,0" data-to="0,2.8,0" marker-end="url(#axis)"/><text x="132.60000000000002" y="425" font-size="16" fill="#25364a">y</text><line x1="260" y1="350" x2="260" y2="140" stroke="#5b697c" stroke-width="1.4" data-from="0,0,0" data-to="0,0,3" marker-end="url(#axis)"/><text x="267" y="145" font-size="16" fill="#25364a">z</text><polygon points="245.60000000000002,403.4 411.2,302.2 300.79999999999995,198.7 135.20000000000002,299.9" fill="#dceee8" fill-opacity="0.85" stroke="#78b29f" stroke-width="1.5" data-world-points="-0.6,-0.6,-1.2 1.7,-0.6,1.1 1.7,1.7,3.4 -0.6,1.7,1.1"/><line x1="260" y1="350" x2="332" y2="306" stroke="#2166b1" stroke-width="3.5" data-from="0,0,0" data-to="1,0,1" marker-end="url(#blue)"/><line x1="260" y1="350" x2="212" y2="305" stroke="#d77917" stroke-width="3.5" data-from="0,0,0" data-to="0,1,1" marker-end="url(#orange)"/><line x1="260" y1="350" x2="332" y2="376" stroke="#8957b1" stroke-width="3.5" data-from="0,0,0" data-to="1,0,0" marker-end="url(#purple)"/><line x1="332" y1="376" x2="332" y2="306" stroke="#8957b1" stroke-width="1.6" data-from="1,0,0" data-to="1,0,1" stroke-dasharray="5 4"/><text x="240" y="370" font-size="15" fill="#25364a">O</text><circle cx="332" cy="306" r="4" fill="#2166b1" data-point="1,0,1"/><text x="342" y="296" font-size="16" fill="#2166b1">v₁ = (1, 0, 1)</text><circle cx="212" cy="305" r="4" fill="#d77917" data-point="0,1,1"/><text x="87" y="293" font-size="16" fill="#d77917">v₂ = (0, 1, 1)</text><circle cx="332" cy="376" r="4" fill="#8957b1" data-point="1,0,0"/><text x="344" y="391" font-size="16" fill="#8957b1">e₁ = (1, 0, 0)</text><text x="620" y="117" font-size="21" fill="#25364a">Prima: due vettori indipendenti</text><text x="620" y="152" font-size="18" fill="#25364a">Generano un piano per l'origine.</text><text x="620" y="209" font-size="21" fill="#8957b1">La nuova direzione è fuori:</text><text x="620" y="244" font-size="19" fill="#8957b1">e₁ = (1, 0, 0)</text><text x="620" y="275" font-size="19" fill="#8957b1">0 ≠ 1 + 0</text><text x="620" y="337" font-size="20" fill="#008568">Dopo: (v₁, v₂, e₁) è una base di ℝ³</text><text x="620" y="378" font-size="18" fill="#25364a">Per ogni (x, y, z):</text><text x="620" y="410" font-size="19" fill="#25364a">α = z − y,   β = y,</text><text x="620" y="441" font-size="19" fill="#25364a">γ = x − z + y</text><text x="620" y="479" font-size="18" fill="#25364a">(x, y, z) = αv₁ + βv₂ + γe₁</text><text x="28" y="550" font-size="15" fill="#25364a">Proiezione obliqua schematica: angoli e lunghezze non sono conservati; le coordinate sono esatte.</text><text x="28" y="579" font-size="15" fill="#25364a">La porzione colorata è solo una finestra del piano infinito. Figura del tutor.</text></g></svg>
