<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="595" viewBox="0 0 1040 595" role="img" aria-labelledby="title desc"><title id="title">Retta e piano nello spazio</title><desc id="desc">Proiezione obliqua schematica di una retta con direzione meno uno zero uno e un piano di equazione meno x più y più z uguale uno.</desc><defs><marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526174"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2166b1"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#d77917"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#008568"/></marker></defs><rect width="1040" height="595" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="35" font-size="25" fill="#26364a" >Retta e piano nello spazio: punti e direzioni</text><rect x="24" y="62" width="480" height="449" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><rect x="526" y="62" width="490" height="449" rx="12" fill="#f7f9fc" stroke="#dbe2eb"/><line x1="139" y1="267" x2="337" y2="267" stroke="#9aa7b7" stroke-width="1.3" marker-end="url(#axis)"/><line x1="167" y1="249" x2="269.6" y2="317.4" stroke="#9aa7b7" stroke-width="1.3" marker-end="url(#axis)"/><line x1="194" y1="308.6" x2="194" y2="137" stroke="#9aa7b7" stroke-width="1.3" marker-end="url(#axis)"/><text x="344.75" y="270" font-size="14" fill="#26364a" >x</text><text x="277.3" y="322.2" font-size="14" fill="#26364a" >y</text><text x="199" y="137.4" font-size="14" fill="#26364a" >z</text><text x="177" y="285" font-size="14" fill="#26364a" >O</text><line x1="635" y1="275" x2="833" y2="275" stroke="#9aa7b7" stroke-width="1.3" marker-end="url(#axis)"/><line x1="663" y1="257" x2="765.6" y2="325.4" stroke="#9aa7b7" stroke-width="1.3" marker-end="url(#axis)"/><line x1="690" y1="316.6" x2="690" y2="145" stroke="#9aa7b7" stroke-width="1.3" marker-end="url(#axis)"/><text x="840.75" y="278" font-size="14" fill="#26364a" >x</text><text x="773.3" y="330.2" font-size="14" fill="#26364a" >y</text><text x="695" y="145.4" font-size="14" fill="#26364a" >z</text><text x="673" y="293" font-size="14" fill="#26364a" >O</text><text x="42" y="92" font-size="21" fill="#26364a" >Retta: un parametro libero</text><line x1="358.5" y1="363" x2="188" y2="201.8" stroke="#2166b1" stroke-width="3" /><line x1="276" y1="285" x2="221" y2="233" stroke="#008568" stroke-width="3" marker-end="url(#green)"/><circle cx="276" cy="285" r="4" fill="#b86512" data-point="1,1,0"/><text x="256" y="312" font-size="15" fill="#b86512" >P = (1, 1, 0)</text><circle cx="221" cy="233" r="4" fill="#008568" data-point="0,1,1"/><text x="116" y="220" font-size="15" fill="#008568" >P + v = (0, 1, 1)</text><text x="263" y="243" font-size="15" fill="#008568" >v = (−1, 0, 1)</text><text x="42" y="403" font-size="19" fill="#26364a" >x = P + tv</text><text x="42" y="437" font-size="18" fill="#26364a" >y = 1,  x + z = 1</text><text x="42" y="475" font-size="16" fill="#26364a" >Rango 2: 3 − 2 = 1 parametro</text><text x="544" y="92" font-size="21" fill="#26364a" >Piano: due direzioni indipendenti</text><polygon points="643.5,219.2 753.5,115.20000000000002 807.5,255.2 697.5,359.2" fill="#d9eee7" fill-opacity="0.75" stroke="#77b7a5" stroke-width="1.5"/><line x1="690" y1="223" x2="745" y2="171" stroke="#2166b1" stroke-width="3" marker-end="url(#blue)"/><line x1="690" y1="223" x2="717" y2="293" stroke="#d77917" stroke-width="3" marker-end="url(#orange)"/><line x1="745" y1="171" x2="772" y2="241" stroke="#d77917" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="717" y1="293" x2="772" y2="241" stroke="#2166b1" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="690" cy="223" r="4" fill="#26364a" data-point="0,0,1"/><text x="565" y="218" font-size="15" fill="#26364a" >P = (0, 0, 1)</text><circle cx="772" cy="241" r="4" fill="#008568" data-point="1,1,1"/><text x="780" y="257" font-size="15" fill="#008568" >Q = (1, 1, 1)</text><text x="746" y="151" font-size="17" fill="#2166b1" >v</text><text x="700" y="295" font-size="17" fill="#b86512" >w</text><text x="544" y="403" font-size="17" fill="#26364a" >v = (1, 0, 1),  w = (0, 1, −1)</text><text x="544" y="437" font-size="17" fill="#26364a" >x = P + sv + tw;  −x + y + z = 1</text><text x="544" y="475" font-size="16" fill="#26364a" >Rango 1: 3 − 1 = 2 parametri</text><text x="28" y="544" font-size="16" fill="#26364a" >Proiezione obliqua schematica: angoli e lunghezze spaziali non sono conservati.</text><text x="28" y="572" font-size="15" fill="#26364a" >Le coordinate sono esatte. Il parallelogramma mostra solo una porzione del piano infinito.</text></g></svg>
