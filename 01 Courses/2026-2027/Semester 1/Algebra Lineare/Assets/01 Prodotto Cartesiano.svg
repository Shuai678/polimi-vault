<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-labelledby="titolo descrizione">
  <title id="titolo">Confronto fra i prodotti cartesiani A per B e B per A</title>
  <desc id="descrizione">A contiene 1 e 2; B contiene 3 e 4. A per B contiene i quattro punti (1,3), (1,4), (2,3), (2,4). B per A contiene (3,1), (3,2), (4,1), (4,2). Entrambi i piani usano la stessa scala, con 60 pixel per unità su ciascun asse.</desc>
  <defs>
    <marker id="freccia-asse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <g id="griglia" fill="none" stroke="#e2e8f0" stroke-width="1">
      <path d="M60 0V-300 M120 0V-300 M180 0V-300 M240 0V-300 M300 0V-300 M0-60H300 M0-120H300 M0-180H300 M0-240H300 M0-300H300"/>
    </g>
    <g id="assi" fill="none" stroke="#475569" stroke-width="1.6">
      <path d="M-12 0H322" marker-end="url(#freccia-asse)"/>
      <path d="M0 12V-322" marker-end="url(#freccia-asse)"/>
    </g>
    <g id="tacche" fill="#64748b" font-size="15" text-anchor="middle">
      <text x="-13" y="20">0</text>
      <text x="60" y="23">1</text>
      <text x="120" y="23">2</text>
      <text x="180" y="23">3</text>
      <text x="240" y="23">4</text>
      <text x="300" y="23">5</text>
      <text x="-18" y="-55">1</text>
      <text x="-18" y="-115">2</text>
      <text x="-18" y="-175">3</text>
      <text x="-18" y="-235">4</text>
      <text x="-18" y="-295">5</text>
    </g>
  </defs>
  <rect width="940" height="600" rx="18" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="42" fill="#0f172a" font-size="25" font-weight="700">Il prodotto cartesiano: l'ordine conta</text>
    <text x="38" y="76" fill="#475569" font-size="19">A = {1, 2}     B = {3, 4}</text>
    <rect x="29" y="99" width="422" height="427" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="489" y="99" width="422" height="427" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="62" y="133" fill="#1d4ed8" font-size="22" font-weight="700">A × B</text>
    <text x="161" y="132" fill="#475569" font-size="16">prima da A, seconda da B</text>
    <text x="522" y="133" fill="#b45309" font-size="22" font-weight="700">B × A</text>
    <text x="621" y="132" fill="#475569" font-size="16">prima da B, seconda da A</text>
    <g transform="translate(85 468)">
      <use href="#griglia"/>
      <use href="#assi"/>
      <use href="#tacche"/>
      <text x="321" y="24" fill="#475569" font-size="17" font-style="italic">x</text>
      <text x="-23" y="-313" fill="#475569" font-size="17" font-style="italic">y</text>
      <g fill="#2563eb" stroke="#ffffff" stroke-width="2.5">
        <circle cx="60" cy="-180" r="6.5"/>
        <circle cx="60" cy="-240" r="6.5"/>
        <circle cx="120" cy="-180" r="6.5"/>
        <circle cx="120" cy="-240" r="6.5"/>
      </g>
      <g fill="#1e40af" font-size="16" text-anchor="middle">
        <text x="60" y="-193">(1, 3)</text>
        <text x="60" y="-253">(1, 4)</text>
        <text x="120" y="-193">(2, 3)</text>
        <text x="120" y="-253">(2, 4)</text>
      </g>
    </g>
    <g transform="translate(545 468)">
      <use href="#griglia"/>
      <use href="#assi"/>
      <use href="#tacche"/>
      <text x="321" y="24" fill="#475569" font-size="17" font-style="italic">x</text>
      <text x="-23" y="-313" fill="#475569" font-size="17" font-style="italic">y</text>
      <g fill="#d97706" stroke="#ffffff" stroke-width="2.5">
        <circle cx="180" cy="-60" r="6.5"/>
        <circle cx="180" cy="-120" r="6.5"/>
        <circle cx="240" cy="-60" r="6.5"/>
        <circle cx="240" cy="-120" r="6.5"/>
      </g>
      <g fill="#92400e" font-size="16" text-anchor="middle">
        <text x="180" y="-73">(3, 1)</text>
        <text x="180" y="-133">(3, 2)</text>
        <text x="240" y="-73">(4, 1)</text>
        <text x="240" y="-133">(4, 2)</text>
      </g>
    </g>
    <text x="39" y="557" fill="#334155" font-size="17">Ogni prodotto contiene soltanto i quattro punti indicati, non la zona fra di essi.</text>
    <text x="39" y="584" fill="#64748b" font-size="15">Disegno in scala: una unità ha la stessa lunghezza su entrambi gli assi e in entrambi i pannelli.</text>
  </g>
</svg>
