<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="840" viewBox="0 0 1040 840" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">Iniettività suriettività e biiettività di funzioni fra insiemi finiti</title>
<desc id="descrizione">Quattro funzioni. La prima non è né iniettiva né suriettiva; la seconda è iniettiva ma lascia un elemento del codominio non raggiunto; la terza è suriettiva ma due ingressi hanno la stessa immagine; la quarta è biiettiva.</desc>
<defs><marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="840" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="26" y="39" fill="#0f172a" font-size="26" font-weight="700">Funzioni: come si raggiunge il codominio</text>
<text x="26" y="73" fill="#475569" font-size="18">In ogni pannello ogni elemento di A ha esattamente una immagine in B.</text>
