<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Simmetria delle funzioni pari e dispari</title>
  <desc id="desc">A sinistra una parabola simmetrica rispetto all'asse y, a destra una cubica simmetrica rispetto all'origine.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="225" y="35" text-anchor="middle" fill="#1a202c" font-size="23" font-weight="700">Funzione pari</text>
    <text x="675" y="35" text-anchor="middle" fill="#1a202c" font-size="23" font-weight="700">Funzione dispari</text>
    <text x="225" y="61" text-anchor="middle" fill="#4a5568" font-size="17">f(-x) = f(x)</text>
    <text x="675" y="61" text-anchor="middle" fill="#4a5568" font-size="17">f(-x) = -f(x)</text>
  </g>
  <g transform="translate(0 2)">
    <rect x="35" y="76" width="380" height="310" rx="12" fill="#f7fafc"/>
    <line x1="55" y1="345" x2="397" y2="345" stroke="#2d3748" stroke-width="2"/>
    <line x1="225" y1="365" x2="225" y2="90" stroke="#2d3748" stroke-width="2"/>
    <path d="M75 113 Q225 345 375 113" fill="none" stroke="#e53e3e" stroke-width="5"/>
    <line x1="145" y1="252" x2="305" y2="252" stroke="#3182ce" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="145" cy="252" r="6" fill="#3182ce"/>
    <circle cx="305" cy="252" r="6" fill="#3182ce"/>
    <g fill="#2d3748" font-family="Arial, sans-serif" font-size="16">
      <text x="130" y="371">-x</text><text x="299" y="371">x</text>
      <text x="233" y="102">y</text><text x="391" y="366">x</text>
      <text x="225" y="411" text-anchor="middle">simmetria rispetto all'asse y</text>
    </g>
  </g>
  <g transform="translate(0 2)">
    <rect x="485" y="76" width="380" height="310" rx="12" fill="#f7fafc"/>
    <line x1="505" y1="230" x2="847" y2="230" stroke="#2d3748" stroke-width="2"/>
    <line x1="675" y1="365" x2="675" y2="90" stroke="#2d3748" stroke-width="2"/>
    <path d="M525 345 C585 345 610 265 675 230 C740 195 765 115 825 115" fill="none" stroke="#e53e3e" stroke-width="5"/>
    <line x1="604" y1="286" x2="746" y2="174" stroke="#3182ce" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="604" cy="286" r="6" fill="#3182ce"/>
    <circle cx="746" cy="174" r="6" fill="#3182ce"/>
    <g fill="#2d3748" font-family="Arial, sans-serif" font-size="16">
      <text x="665" y="249">O</text><text x="833" y="250">x</text><text x="684" y="102">y</text>
      <text x="675" y="411" text-anchor="middle">simmetria rispetto all'origine</text>
    </g>
  </g>
</svg>
