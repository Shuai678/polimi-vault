<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="492" viewBox="0 0 1280 492" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" fill="#233447">
  <title id="title">Criterio del rapporto: gli intorni del limite rispetto alla soglia 1</title>
  <desc id="desc">Ricostruzione dello schema del docente, Lezione 12, pagina 2 del PDF. Sulla stessa retta sono rappresentati due casi distinti: in rosso un limite ell minore di 1, con estremo destro ell più epsilon uguale a q minore di 1; in blu un limite ell finito maggiore di 1, con estremo sinistro ell meno epsilon uguale a q maggiore di 1. Le disuguaglianze per il rapporto tra termini consecutivi valgono definitivamente.</desc>
  <defs>
    <pattern id="negative" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a6b3c0" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1280" height="492" rx="18" fill="#f7fafc"/>
  <text x="48" y="44" font-size="29" font-weight="700">Criterio del rapporto: il ruolo di ε</text>
  <text x="48" y="77" font-size="20" fill="#607487">Intorni di ℓ per il rapporto tra termini consecutivi. Schema del docente: Lezione 12, p. 2.</text>

  <rect x="32" y="100" width="1216" height="232" rx="12" fill="#ffffff" stroke="#dce5ed"/>
  <text x="350" y="140" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" text-anchor="middle">Caso 0 ≤ ℓ &lt; 1</text>
  <text x="922" y="140" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" text-anchor="middle">Caso 1 &lt; ℓ &lt; +∞</text>

  <rect x="240" y="181" width="220" height="72" rx="8" fill="#fce9e9"/>
  <rect x="746" y="181" width="352" height="72" rx="8" fill="#e8f2fd"/>
  <rect x="80" y="222" width="50" height="31" fill="url(#negative)" opacity="0.75"/>
  <line x1="570" y1="159" x2="570" y2="300" stroke="#97a6b5" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M 80 238 H 1194 M 1185 231 L 1194 238 L 1185 245" fill="none" stroke="#233447" stroke-width="2.5"/>

  <line x1="130" y1="228" x2="130" y2="248" stroke="#233447" stroke-width="2.5"/>
  <text x="130" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" text-anchor="middle">0</text>
  <line x1="570" y1="227" x2="570" y2="249" stroke="#233447" stroke-width="3"/>
  <text x="570" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" text-anchor="middle">1</text>
  <text x="570" y="311" font-size="18" fill="#607487" text-anchor="middle">soglia</text>

  <line x1="240" y1="238" x2="460" y2="238" stroke="#d13d43" stroke-width="6"/>
  <circle cx="240" cy="238" r="6" fill="#ffffff" stroke="#d13d43" stroke-width="2.5"/>
  <circle cx="460" cy="238" r="6" fill="#ffffff" stroke="#d13d43" stroke-width="2.5"/>
  <line x1="350" y1="229" x2="350" y2="247" stroke="#d13d43" stroke-width="2.5"/>
  <text x="350" y="214" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" text-anchor="middle">ℓ</text>
  <text x="240" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" text-anchor="middle">ℓ − ε</text>
  <text x="460" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" text-anchor="middle">q = ℓ + ε</text>

  <line x1="746" y1="238" x2="1098" y2="238" stroke="#2477c7" stroke-width="6"/>
  <circle cx="746" cy="238" r="6" fill="#ffffff" stroke="#2477c7" stroke-width="2.5"/>
  <circle cx="1098" cy="238" r="6" fill="#ffffff" stroke="#2477c7" stroke-width="2.5"/>
  <line x1="922" y1="229" x2="922" y2="247" stroke="#2477c7" stroke-width="2.5"/>
  <text x="922" y="214" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" text-anchor="middle">ℓ</text>
  <text x="746" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" text-anchor="middle">q = ℓ − ε</text>
  <text x="1098" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" text-anchor="middle">ℓ + ε</text>

  <rect x="32" y="350" width="594" height="91" rx="12" fill="#fce9e9"/>
  <text x="329" y="382" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" text-anchor="middle">ε = (1 − ℓ) / 2</text>
  <g aria-label="an+1 / an &lt; q &lt; 1">
    <text x="234.50" y="420" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" xml:space="preserve">a</text>
    <text x="248.50" y="427" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#d13d43" xml:space="preserve">n+1</text>
    <text x="279.50" y="420" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" xml:space="preserve"> / a</text>
    <text x="320.50" y="427" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#d13d43" xml:space="preserve">n</text>
    <text x="331.50" y="420" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#d13d43" xml:space="preserve"> &lt; q &lt; 1</text>
  </g>
  <rect x="646" y="350" width="602" height="91" rx="12" fill="#e8f2fd"/>
  <text x="947" y="382" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" text-anchor="middle">ε = (ℓ − 1) / 2</text>
  <g aria-label="1 &lt; q &lt; an+1 / an">
    <text x="855.00" y="420" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" xml:space="preserve">1 &lt; q &lt; a</text>
    <text x="956.00" y="427" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#2477c7" xml:space="preserve">n+1</text>
    <text x="987.00" y="420" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#2477c7" xml:space="preserve"> / a</text>
    <text x="1028.00" y="427" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#2477c7" xml:space="preserve">n</text>
  </g>

  <text x="48" y="474" font-size="19" fill="#607487">Due casi distinti; le disuguaglianze per il rapporto valgono da un certo indice in poi.</text>
</svg>
