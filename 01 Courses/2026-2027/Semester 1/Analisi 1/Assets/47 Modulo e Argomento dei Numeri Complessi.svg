<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Modulo e argomento di un numero complesso</title>
  <desc id="desc">Il punto z uguale a x più iy è collegato all'origine da un segmento di lunghezza rho; theta è l'angolo orientato rispetto al semiasse reale positivo.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#dbe4ee" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#f8fafc"/>
  <text x="450" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#0f172a">Modulo e argomento</text>
  <rect x="85" y="85" width="730" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="135" y="120" width="620" height="450" fill="url(#grid)" stroke="#cbd5e1"/>
  <line x1="155" y1="470" x2="735" y2="470" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="545" x2="260" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="725" y="500" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">Re</text>
  <text x="225" y="155" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">Im</text>
  <line x1="260" y1="470" x2="610" y2="245" stroke="#2563eb" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <circle cx="610" cy="245" r="8" fill="#2563eb"/>
  <line x1="610" y1="245" x2="610" y2="470" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="260" y1="245" x2="610" y2="245" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <path d="M 360 470 A 100 100 0 0 0 344 416" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <text x="365" y="437" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#b45309">θ</text>
  <text x="438" y="340" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#2563eb">ρ = |z|</text>
  <text x="628" y="235" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">z = x + iy</text>
  <text x="598" y="500" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">x</text>
  <text x="232" y="252" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">y</text>
  <text x="365" y="600" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">ρ determina la distanza; θ determina la direzione.</text>
</svg>
