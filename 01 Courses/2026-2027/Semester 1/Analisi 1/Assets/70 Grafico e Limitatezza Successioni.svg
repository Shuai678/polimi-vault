<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Grafico discreto della successione due fratto n più uno</title>
  <desc id="desc">I punti con ascissa naturale scendono da due verso zero e restano compresi tra zero e due.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <rect x="70" y="55" width="760" height="390" rx="15" fill="#f7fafc"/>
  <rect x="105" y="105" width="680" height="300" fill="#ebf8ff" opacity="0.8"/>
  <g stroke="#2d3748" stroke-width="2.2">
    <line x1="105" y1="405" x2="810" y2="405"/>
    <line x1="130" y1="430" x2="130" y2="75"/>
  </g>
  <line x1="105" y1="105" x2="785" y2="105" stroke="#3182ce" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="105" y1="405" x2="785" y2="405" stroke="#805ad5" stroke-width="2" stroke-dasharray="8 6"/>
  <g stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="4 5">
    <line x1="130" y1="105" x2="130" y2="405"/><line x1="220" y1="255" x2="220" y2="405"/>
    <line x1="310" y1="305" x2="310" y2="405"/><line x1="400" y1="330" x2="400" y2="405"/>
    <line x1="490" y1="345" x2="490" y2="405"/><line x1="580" y1="355" x2="580" y2="405"/>
    <line x1="670" y1="362" x2="670" y2="405"/><line x1="760" y1="368" x2="760" y2="405"/>
  </g>
  <g fill="#e53e3e">
    <circle cx="130" cy="105" r="8"/><circle cx="220" cy="255" r="8"/><circle cx="310" cy="305" r="8"/>
    <circle cx="400" cy="330" r="8"/><circle cx="490" cy="345" r="8"/><circle cx="580" cy="355" r="8"/>
    <circle cx="670" cy="362" r="8"/><circle cx="760" cy="368" r="8"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#2d3748" font-size="17">
    <text x="815" y="412">n</text><text x="138" y="78">aₙ</text>
    <text x="105" y="99" fill="#3182ce">2</text><text x="104" y="425" fill="#805ad5">0</text>
    <text x="123" y="430">0</text><text x="214" y="430">1</text><text x="304" y="430">2</text><text x="748" y="430">7</text>
    <text x="500" y="91" fill="#1a202c">aₙ = 2/(n+1)</text>
  </g>
  <text x="450" y="486" text-anchor="middle" font-family="Arial, sans-serif" fill="#4a5568" font-size="19">Il grafico è un insieme di punti (n,aₙ): 0 &lt; aₙ ≤ 2</text>
</svg>
