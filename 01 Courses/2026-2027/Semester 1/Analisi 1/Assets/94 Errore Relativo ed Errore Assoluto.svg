<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Equivalenza: errore relativo ed errore assoluto</title><desc id="desc">Per a(n)=n quadrato più n e b(n)=n quadrato, l’errore relativo uno su n tende a zero mentre l’errore assoluto n cresce senza limite. I due pannelli hanno scale verticali diverse.</desc><rect width="100%" height="100%" rx="12" fill="#fbfcfe"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="40" y="44" font-size="25" fill="#1c2b3a" text-anchor="start">Equivalenza: errore relativo ed errore assoluto</text>
<text x="40" y="81" font-size="19" fill="#1c2b3a" text-anchor="start">a(n) = n² + n,  b(n) = n²:  a(n) / b(n) = 1 + 1/n → 1</text>
<text x="80" y="136" font-size="20" fill="#1c2b3a" text-anchor="start">Errore relativo = 1/n</text>
