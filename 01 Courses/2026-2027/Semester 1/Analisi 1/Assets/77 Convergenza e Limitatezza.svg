<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Convergenza e limitatezza</title><desc id="desc">Esempio di successione che tende a uno, con due termini iniziali esterni alla fascia del limite.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="35.0" y="32.0" font-size="23" fill="#475569" text-anchor="start">Convergenza: coda controllata e primi termini finiti</text><line x1="100.0" y1="337.0" x2="802.0" y2="337.0" stroke="#475569" stroke-width="1.5"/><line x1="100.0" y1="82.0" x2="100.0" y2="337.0" stroke="#475569" stroke-width="1.5"/><text x="809.0" y="342.0" font-size="16" fill="#475569" text-anchor="start">n</text><rect x="181.2" y="173.1" width="608.8" height="72.9" fill="#dbeafe" opacity="0.6"/><line x1="100.0" y1="100.2" x2="790.0" y2="100.2" stroke="#059669" stroke-width="1.5"/><text x="815.0" y="105.2" font-size="16" fill="#059669" text-anchor="start">L = 4</text><line x1="100.0" y1="318.8" x2="790.0" y2="318.8" stroke="#059669" stroke-width="1.5"/><text x="815.0" y="323.8" font-size="16" fill="#059669" text-anchor="start">P = −2</text><line x1="100.0" y1="173.1" x2="790.0" y2="173.1" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/><text x="815.0" y="178.1" font-size="16" fill="#2563eb" text-anchor="start">ℓ + 1</text><line x1="100.0" y1="245.9" x2="790.0" y2="245.9" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/><text x="815.0" y="250.9" font-size="16" fill="#2563eb" text-anchor="start">ℓ − 1</text><line x1="100.0" y1="209.5" x2="790.0" y2="209.5" stroke="#dc2626" stroke-width="1.5"/><text x="815.0" y="214.5" font-size="16" fill="#dc2626" text-anchor="start">ℓ = 1</text><line x1="181.2" y1="82.0" x2="181.2" y2="337.0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/><text x="181.2" y="360.0" font-size="16" fill="#475569" text-anchor="middle">N = 2</text><circle cx="100.0" cy="100.2" r="4" stroke="#dc2626" fill="#dc2626"/><circle cx="140.6" cy="318.8" r="4" stroke="#dc2626" fill="#dc2626"/><circle cx="181.2" cy="191.3" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="221.8" cy="221.6" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="262.4" cy="200.4" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="302.9" cy="216.8" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="343.5" cy="203.4" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="384.1" cy="214.7" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="424.7" cy="204.9" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="465.3" cy="213.5" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="505.9" cy="205.9" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="546.5" cy="212.8" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="587.1" cy="206.5" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="627.6" cy="212.3" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="668.2" cy="206.9" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="708.8" cy="211.9" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="749.4" cy="207.2" r="4" stroke="#2563eb" fill="#2563eb"/><text x="35.0" y="395.0" font-size="16" fill="#475569" text-anchor="start">a₀ = 4, a₁ = −2; a<tspan baseline-shift="sub" font-size="12">n</tspan> = 1 + (−1)ⁿ/n per n ≥ 2</text><text x="35.0" y="425.0" font-size="16" fill="#475569" text-anchor="start">Le barriere P e L controllano tutti i termini; la fascia blu controlla la coda.</text></g></svg>