<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Estremi della funzione uno fratto uno più x quadrato</title>
  <desc id="desc">Il grafico raggiunge il massimo uno in x uguale zero e tende a zero senza raggiungerlo.</desc>
  <rect width="800" height="450" fill="#ffffff"/>
  <rect x="76" y="82" width="650" height="286" rx="12" fill="#f7fafc"/>
  <g stroke="#cbd5e0" stroke-width="1">
    <line x1="76" y1="150" x2="726" y2="150"/>
    <line x1="76" y1="220" x2="726" y2="220"/>
    <line x1="76" y1="290" x2="726" y2="290"/>
  </g>
  <g stroke="#2d3748" stroke-width="2">
    <line x1="76" y1="368" x2="742" y2="368"/>
    <line x1="401" y1="394" x2="401" y2="64"/>
  </g>
  <g fill="#2d3748" font-family="Arial, sans-serif" font-size="17">
    <text x="744" y="374">x</text>
    <text x="409" y="65">y</text>
    <text x="378" y="391">0</text>
  </g>
  <line x1="76" y1="104" x2="726" y2="104" stroke="#3182ce" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="76" y1="368" x2="726" y2="368" stroke="#805ad5" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M88 354 C170 346 246 325 302 281 C348 245 374 173 401 104 C428 173 454 245 500 281 C556 325 632 346 714 354" fill="none" stroke="#e53e3e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="401" cy="104" r="7" fill="#e53e3e"/>
  <g fill="#1a202c" font-family="Arial, sans-serif" font-size="18">
    <text x="92" y="96">y = 1 = max f = sup f</text>
    <text x="92" y="357">y = 0 = inf f, non raggiunto</text>
    <text x="475" y="132">f(0) = 1</text>
    <text x="516" y="250">f(x) = 1/(1+x²)</text>
  </g>
  <text x="400" y="430" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="18">Im f = (0, 1]</text>
</svg>
