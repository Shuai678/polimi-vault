<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Radici ennesime complesse disposte su un poligono regolare</title>
  <desc id="desc">L'esempio delle sei radici complesse di meno uno mostra sei punti con lo stesso modulo, separati da un angolo pi greco terzi e disposti ai vertici di un esagono regolare.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dbe4ee" stroke-width="1"/>
    </pattern>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#f8fafc"/>
  <text x="500" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Radici ennesime complesse</text>

  <rect x="45" y="78" width="625" height="625" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="357" y="113" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Esempio: le sei radici di w = −1</text>
  <rect x="78" y="132" width="558" height="530" fill="url(#grid)" stroke="#e2e8f0"/>

  <line x1="95" y1="405" x2="625" y2="405" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <line x1="350" y1="645" x2="350" y2="145" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="606" y="436" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">Re</text>
  <text x="314" y="160" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">Im</text>
  <text x="326" y="434" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">O</text>

  <circle cx="350" cy="405" r="210" fill="#2563eb" fill-opacity="0.035" stroke="#60a5fa" stroke-width="3"/>
  <text x="485" y="584" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1d4ed8">raggio = |w|<tspan baseline-shift="super" font-size="13">1/6</tspan> = 1</text>

  <polygon points="532,300 350,195 168,300 168,510 350,615 532,510" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-width="4"/>

  <line x1="350" y1="405" x2="532" y2="300" stroke="#2563eb" stroke-width="3"/>
  <line x1="350" y1="405" x2="350" y2="195" stroke="#2563eb" stroke-width="3"/>
  <line x1="350" y1="405" x2="168" y2="300" stroke="#2563eb" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="350" y1="405" x2="168" y2="510" stroke="#2563eb" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="350" y1="405" x2="350" y2="615" stroke="#2563eb" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="350" y1="405" x2="532" y2="510" stroke="#2563eb" stroke-width="2" stroke-opacity="0.55"/>

  <circle cx="532" cy="300" r="8" fill="#2563eb"/>
  <circle cx="350" cy="195" r="8" fill="#2563eb"/>
  <circle cx="168" cy="300" r="8" fill="#2563eb"/>
  <circle cx="168" cy="510" r="8" fill="#2563eb"/>
  <circle cx="350" cy="615" r="8" fill="#2563eb"/>
  <circle cx="532" cy="510" r="8" fill="#2563eb"/>

  <text x="548" y="289" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">z₀</text>
  <text x="350" y="181" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">z₁</text>
  <text x="128" y="289" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">z₂</text>
  <text x="128" y="537" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">z₃</text>
  <text x="350" y="642" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">z₄</text>
  <text x="548" y="537" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">z₅</text>

  <circle cx="140" cy="405" r="8" fill="#f59e0b"/>
  <text x="91" y="390" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">w = −1</text>
  <text x="92" y="429" font-family="Inter, Arial, sans-serif" font-size="16" fill="#92400e">arg w = π</text>

  <path d="M 415 405 A 65 65 0 0 0 406 373" fill="none" stroke="#d97706" stroke-width="4"/>
  <text x="418" y="390" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">π/6</text>

  <path d="M 445 350 A 110 110 0 0 0 350 295" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amber-arrow)"/>
  <text x="386" y="292" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">Δθ = π/3</text>

  <rect x="695" y="108" width="270" height="525" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="830" y="149" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Caso generale</text>
  <text x="830" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">w = R e<tspan baseline-shift="super" font-size="12">iφ</tspan> ≠ 0</text>

  <text x="722" y="229" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#4c1d95">Le radici sono</text>
  <text x="830" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">zₖ = R<tspan baseline-shift="super" font-size="13">1/n</tspan> e<tspan baseline-shift="super" font-size="13">iθₖ</tspan></text>
  <text x="830" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">θₖ = (φ + 2kπ)/n</text>
  <text x="830" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">k = 0, 1, …, n − 1</text>

  <line x1="721" y1="365" x2="939" y2="365" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="724" cy="410" r="8" fill="#2563eb"/>
  <text x="747" y="405" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Stesso modulo</text>
  <text x="747" y="431" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">R<tspan baseline-shift="super" font-size="12">1/n</tspan></text>

  <circle cx="724" cy="473" r="8" fill="#d97706"/>
  <text x="747" y="468" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">Stesso intervallo</text>
  <text x="747" y="494" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Δθ = 2π/n</text>

  <circle cx="724" cy="536" r="8" fill="#dc2626"/>
  <text x="747" y="531" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Figura risultante</text>
  <text x="747" y="557" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">poligono regolare</text>
  <text x="747" y="583" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">di n vertici</text>

  <text x="500" y="735" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#334155">Le radici hanno lo stesso modulo e argomenti equidistanti.</text>
</svg>
