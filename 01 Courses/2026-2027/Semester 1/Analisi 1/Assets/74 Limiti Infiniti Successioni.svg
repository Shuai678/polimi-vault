<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Limiti più infinito e meno infinito per successioni</title>
  <desc id="desc">A sinistra i termini superano ogni soglia M dopo un indice N; a destra scendono sotto meno M.</desc>
  <rect width="1000" height="520" fill="#ffffff"/>
  <g fill="#f7fafc" stroke="#e2e8f0"><rect x="30" y="65" width="450" height="390" rx="15"/><rect x="520" y="65" width="450" height="390" rx="15"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#1a202c"><text x="255" y="35" font-size="24" font-weight="700">aₙ → +∞</text><text x="745" y="35" font-size="24" font-weight="700">aₙ → −∞</text></g>
  <g stroke="#2d3748" stroke-width="2"><path d="M55 405 H455 M90 430 V85"/><path d="M545 125 H945 M580 440 V85"/></g>
  <line x1="55" y1="245" x2="455" y2="245" stroke="#3182ce" stroke-width="3"/>
  <line x1="545" y1="285" x2="945" y2="285" stroke="#3182ce" stroke-width="3"/>
  <line x1="240" y1="95" x2="240" y2="425" stroke="#805ad5" stroke-width="2"/>
  <line x1="730" y1="95" x2="730" y2="430" stroke="#805ad5" stroke-width="2"/>
  <g fill="#e53e3e">
    <circle cx="120" cy="365" r="6"/><circle cx="170" cy="315" r="6"/><circle cx="220" cy="260" r="6"/><circle cx="270" cy="220" r="6"/><circle cx="320" cy="175" r="6"/><circle cx="370" cy="125" r="6"/><circle cx="420" cy="95" r="6"/>
    <circle cx="610" cy="165" r="6"/><circle cx="660" cy="225" r="6"/><circle cx="710" cy="272" r="6"/><circle cx="760" cy="315" r="6"/><circle cx="810" cy="350" r="6"/><circle cx="860" cy="390" r="6"/><circle cx="910" cy="425" r="6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#2d3748" font-size="17">
    <text x="60" y="239" fill="#3182ce">M</text><text x="550" y="305" fill="#3182ce">−M</text>
    <text x="232" y="450" fill="#805ad5">N</text><text x="722" y="462" fill="#805ad5">N</text>
  </g>
  <text x="255" y="488" text-anchor="middle" font-family="Arial, sans-serif" fill="#4a5568" font-size="17">n ≥ N ⇒ aₙ &gt; M</text>
  <text x="745" y="488" text-anchor="middle" font-family="Arial, sans-serif" fill="#4a5568" font-size="17">n ≥ N ⇒ aₙ &lt; −M</text>
</svg>
