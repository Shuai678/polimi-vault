<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Funzione invertibile ma non monotona</title>
  <desc id="desc">Sul dominio da zero a due, il primo ramo è y uguale x su zero uno escluso e il secondo è y uguale tre meno x su uno due; la funzione è iniettiva ma non monotona.</desc>
  <rect width="820" height="500" fill="#ffffff"/>
  <rect x="80" y="55" width="660" height="360" rx="14" fill="#f7fafc"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="390"/><line x1="400" y1="95" x2="400" y2="390"/><line x1="650" y1="95" x2="650" y2="390"/>
    <line x1="120" y1="360" x2="700" y2="360"/><line x1="120" y1="235" x2="700" y2="235"/><line x1="120" y1="110" x2="700" y2="110"/>
  </g>
  <g stroke="#2d3748" stroke-width="2.2">
    <line x1="115" y1="360" x2="720" y2="360"/>
    <line x1="150" y1="400" x2="150" y2="75"/>
  </g>
  <path d="M150 360 L400 235" fill="none" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="360" r="8" fill="#e53e3e"/>
  <circle cx="400" cy="235" r="9" fill="#ffffff" stroke="#e53e3e" stroke-width="4"/>
  <path d="M400 110 L650 235" fill="none" stroke="#3182ce" stroke-width="6" stroke-linecap="round"/>
  <circle cx="400" cy="110" r="8" fill="#3182ce"/>
  <circle cx="650" cy="235" r="8" fill="#3182ce"/>
  <g font-family="Arial, sans-serif" fill="#1a202c" font-size="18">
    <text x="724" y="367">x</text><text x="158" y="78">y</text>
    <text x="142" y="386">0</text><text x="394" y="386">1</text><text x="644" y="386">2</text>
    <text x="124" y="241">1</text><text x="124" y="116">2</text>
    <text x="216" y="300" fill="#e53e3e">f(x) = x</text>
    <text x="492" y="151" fill="#3182ce">f(x) = 3 − x</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="410" y="452" fill="#1a202c" font-size="20" font-weight="700">Invertibile, ma non monotona su [0, 2]</text>
    <text x="410" y="478" fill="#4a5568" font-size="16">Il salto separa le immagini dei due rami: ogni y ∈ [0, 2] ha una sola controimmagine.</text>
  </g>
</svg>
