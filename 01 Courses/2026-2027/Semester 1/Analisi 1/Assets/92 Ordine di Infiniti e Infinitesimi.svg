<text x="590" y="104" font-size="17" fill="#2563a8" text-anchor="start">● 1/n</text>
<text x="735" y="104" font-size="17" fill="#c45d21" text-anchor="start">● 1/n²</text>
<text x="80" y="494" font-size="20" fill="#1c2b3a" text-anchor="start">n / n² = 1/n → 0</text>
<text x="80" y="526" font-size="17" fill="#2563a8" text-anchor="start">n: ordine inferiore rispetto a n²</text>
<text x="580" y="494" font-size="20" fill="#1c2b3a" text-anchor="start">(1/n²) / (1/n) = 1/n → 0</text>
<text x="580" y="526" font-size="17" fill="#c45d21" text-anchor="start">1/n²: ordine superiore rispetto a 1/n</text>
<text x="80" y="573" font-size="18" fill="#1c2b3a" text-anchor="start">Per gli infinitesimi, ordine superiore significa annullamento più rapido.</text>
