<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Teorema dei due carabinieri</title><desc id="desc">La successione intermedia alterna le due barriere due più o meno uno su n, che tendono entrambe a due.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="30.0" y="32.0" font-size="23" fill="#475569" text-anchor="start">Due barriere con lo stesso limite</text><line x1="95.0" y1="330.0" x2="757.0" y2="330.0" stroke="#475569" stroke-width="1.5"/><line x1="95.0" y1="95.0" x2="95.0" y2="330.0" stroke="#475569" stroke-width="1.5"/><text x="764.0" y="335.0" font-size="16" fill="#475569" text-anchor="start">n</text><line x1="95.0" y1="251.7" x2="745.0" y2="251.7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5"/><text x="766.0" y="255.7" font-size="15" fill="#475569" text-anchor="start">ℓ − ε</text><line x1="95.0" y1="173.3" x2="745.0" y2="173.3" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5"/><text x="766.0" y="177.3" font-size="15" fill="#475569" text-anchor="start">ℓ + ε</text><line x1="95.0" y1="212.5" x2="745.0" y2="212.5" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="766.0" y="216.5" font-size="16" fill="#dc2626" text-anchor="start">ℓ = 2</text><line x1="167.2" y1="95.0" x2="167.2" y2="330.0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/><text x="167.2" y="354.0" font-size="15" fill="#475569" text-anchor="middle">N = 3</text><circle cx="95.0" cy="310.4" r="5" stroke="#2563eb" fill="white"/><circle cx="95.0" cy="114.6" r="5" stroke="#059669" fill="white"/><circle cx="95.0" cy="310.4" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="131.1" cy="261.5" r="5" stroke="#2563eb" fill="white"/><circle cx="131.1" cy="163.5" r="5" stroke="#059669" fill="white"/><circle cx="131.1" cy="163.5" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="167.2" cy="245.1" r="5" stroke="#2563eb" fill="white"/><circle cx="167.2" cy="179.9" r="5" stroke="#059669" fill="white"/><circle cx="167.2" cy="245.1" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="203.3" cy="237.0" r="5" stroke="#2563eb" fill="white"/><circle cx="203.3" cy="188.0" r="5" stroke="#059669" fill="white"/><circle cx="203.3" cy="188.0" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="239.4" cy="232.1" r="5" stroke="#2563eb" fill="white"/><circle cx="239.4" cy="192.9" r="5" stroke="#059669" fill="white"/><circle cx="239.4" cy="232.1" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="275.6" cy="228.8" r="5" stroke="#2563eb" fill="white"/><circle cx="275.6" cy="196.2" r="5" stroke="#059669" fill="white"/><circle cx="275.6" cy="196.2" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="311.7" cy="226.5" r="5" stroke="#2563eb" fill="white"/><circle cx="311.7" cy="198.5" r="5" stroke="#059669" fill="white"/><circle cx="311.7" cy="226.5" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="347.8" cy="224.7" r="5" stroke="#2563eb" fill="white"/><circle cx="347.8" cy="200.3" r="5" stroke="#059669" fill="white"/><circle cx="347.8" cy="200.3" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="383.9" cy="223.4" r="5" stroke="#2563eb" fill="white"/><circle cx="383.9" cy="201.6" r="5" stroke="#059669" fill="white"/><circle cx="383.9" cy="223.4" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="420.0" cy="222.3" r="5" stroke="#2563eb" fill="white"/><circle cx="420.0" cy="202.7" r="5" stroke="#059669" fill="white"/><circle cx="420.0" cy="202.7" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="456.1" cy="221.4" r="5" stroke="#2563eb" fill="white"/><circle cx="456.1" cy="203.6" r="5" stroke="#059669" fill="white"/><circle cx="456.1" cy="221.4" r="2.7" stroke="#dc2626" fill="#dc2626"/><circle cx="492.2" cy="220.7" r="5" stroke="#2563eb" fill="white"/><circle cx="492.2" cy="204.3" r="5" stroke="#059669" fill="white"/><circle cx="492.2" cy="204.3" r="2.7" stroke="#dc2626" fill="#dc2626"/