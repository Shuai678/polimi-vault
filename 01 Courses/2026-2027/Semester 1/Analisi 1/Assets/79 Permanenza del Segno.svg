<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc"><title id="title">Permanenza del segno</title><desc id="desc">La fascia epsilon intorno al limite positivo due resta nel semipiano positivo; alcuni termini iniziali sono negativi.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="30.0" y="32.0" font-size="23" fill="#475569" text-anchor="start">Limite positivo: una fascia che resta sopra zero</text><line x1="92.0" y1="335.0" x2="794.0" y2="335.0" stroke="#475569" stroke-width="1.5"/><line x1="92.0" y1="85.0" x2="92.0" y2="335.0" stroke="#475569" stroke-width="1.5"/><text x="801.0" y="340.0" font-size="16" fill="#475569" text-anchor="start">n</text><rect x="283.7" y="102.9" width="498.3" height="71.4" fill="#d1fae5"/><line x1="92.0" y1="210.0" x2="782.0" y2="210.0" stroke="#475569" stroke-width="1.5"/><text x="798.0" y="215.0" font-size="14" fill="#475569" text-anchor="start">0</text><line x1="92.0" y1="174.3" x2="782.0" y2="174.3" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/><text x="798.0" y="179.3" font-size="14" fill="#059669" text-anchor="start">ℓ − ε = 1</text><line x1="92.0" y1="138.6" x2="782.0" y2="138.6" stroke="#dc2626" stroke-width="1.5"/><text x="798.0" y="143.6" font-size="14" fill="#dc2626" text-anchor="start">ℓ = 2</text><line x1="92.0" y1="102.9" x2="782.0" y2="102.9" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/><text x="798.0" y="107.9" font-size="14" fill="#059669" text-anchor="start">ℓ + ε = 3</text><line x1="283.7" y1="85.0" x2="283.7" y2="335.0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/><text x="283.7" y="360.0" font-size="16" fill="#475569" text-anchor="middle">N = 5</text><circle cx="92.0" cy="317.1" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="130.3" cy="227.9" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="168.7" cy="198.1" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="207.0" cy="183.2" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="245.3" cy="174.3" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="283.7" cy="168.3" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="322.0" cy="164.1" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="360.3" cy="160.9" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="398.7" cy="158.4" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="437.0" cy="156.4" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="475.3" cy="154.8" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="513.7" cy="153.5" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="552.0" cy="152.3" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="590.3" cy="151.3" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="628.7" cy="150.5" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="667.0" cy="149.7" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="705.3" cy="149.1" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="743.7" cy="148.5" r="4" stroke="#2563eb" fill="#2563eb"/><circle cx="782.0" cy="148.0" r="4" stroke="#2563eb" fill="#2563eb"/><text x="30.0" y="396.0" font-size="16" fill="#475569" text-anchor="start">a<tspan baseline-shift="sub" font-size="12">n</tspan> = 2 − 5/(n + 1), ℓ = 2, ε = ℓ/2 = 1</text><text x="30.0" y="424.0" font-size="16" fill="#475569" text-anchor="start">Per n ≥ 5: 1 &lt; a<tspan baseline-shift="sub" font-size="12">n</tspan> &lt; 3. I primi termini possono essere negativi o nulli.</text></g></svg>