<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Prodotto complesso come rotazione e dilatazione</title>
  <desc id="desc">Nel piano complesso sono rappresentati z, il fattore w e il prodotto zw. Moltiplicare z per w ruota z dell'argomento phi di w e ne moltiplica il modulo per il modulo R di w.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dbe4ee" stroke-width="1"/>
    </pattern>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="violet-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#f8fafc"/>
  <text x="500" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Il prodotto complesso: rotazione e dilatazione</text>

  <rect x="45" y="78" width="620" height="585" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="75" y="105" width="560" height="520" fill="url(#grid)" stroke="#e2e8f0"/>

  <line x1="95" y1="565" x2="625" y2="565" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <line x1="280" y1="625" x2="280" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="605" y="596" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">Re</text>
  <text x="244" y="137" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">Im</text>
  <text x="253" y="595" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">O</text>

  <path d="M 365 565 A 85 85 0 0 0 357 529" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="373" y="536" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">θ</text>

  <line x1="280" y1="565" x2="470" y2="476" stroke="#dc2626" stroke-width="5" marker-end="url(#red-arrow)"/>
  <circle cx="470" cy="476" r="7" fill="#dc2626"/>
  <text x="490" y="480" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#b91c1c">z = r e<tspan baseline-shift="super" font-size="16">iθ</tspan></text>
  <text x="385" y="500" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b91c1c">|z| = r</text>

  <line x1="280" y1="565" x2="331" y2="424" stroke="#16a34a" stroke-width="4" marker-end="url(#green-arrow)"/>
  <circle cx="331" cy="424" r="6" fill="#16a34a"/>
  <text x="342" y="412" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#15803d">w = R e<tspan baseline-shift="super" font-size="15">iφ</tspan></text>

  <line x1="280" y1="565" x2="566" y2="432" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 8"/>
  <line x1="478" y1="472" x2="553" y2="437" stroke="#7c3aed" stroke-width="4" marker-end="url(#violet-arrow)"/>
  <text x="420" y="365" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">dilatazione di fattore R</text>

  <path d="M 566 432 A 315 315 0 0 0 253 251" fill="none" stroke="#d97706" stroke-width="5" marker-end="url(#amber-arrow)"/>
  <text x="449" y="303" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">rotazione di φ</text>

  <line x1="280" y1="565" x2="253" y2="251" stroke="#2563eb" stroke-width="6" marker-end="url(#blue-arrow)"/>
  <circle cx="253" cy="251" r="8" fill="#2563eb"/>
  <text x="105" y="230" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#1d4ed8">zw = rR e<tspan baseline-shift="super" font-size="16">i(θ+φ)</tspan></text>
  <text x="112" y="263" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1d4ed8">|zw| = rR</text>

  <rect x="690" y="118" width="275" height="445" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="827" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Moltiplicare per w</text>

  <circle cx="725" cy="210" r="8" fill="#7c3aed"/>
  <text x="748" y="205" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#4c1d95">Modulo</text>
  <text x="748" y="231" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">si moltiplica per R</text>
  <text x="827" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#6d28d9">|zw| = |z||w| = rR</text>

  <line x1="716" y1="297" x2="939" y2="297" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="725" cy="343" r="8" fill="#d97706"/>
  <text x="748" y="338" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#92400e">Argomento</text>
  <text x="748" y="364" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">aumenta di φ</text>
  <text x="827" y="401" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309">arg(zw) = θ + φ</text>
  <text x="827" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">a meno di multipli di 2π</text>

  <line x1="716" y1="456" x2="939" y2="456" stroke="#e2e8f0" stroke-width="2"/>
  <text x="827" y="493" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Effetto complessivo</text>
  <text x="827" y="521" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">rotazione + dilatazione</text>

  <text x="500" y="695" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#334155">Il prodotto somma gli argomenti e moltiplica i moduli.</text>
</svg>
