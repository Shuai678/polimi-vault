<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Somma di numeri complessi con la regola del parallelogramma</title>
  <desc id="desc">I vettori z e w formano i lati di un parallelogramma; la diagonale uscente dall'origine rappresenta z più w.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ded8c7" stroke-width="1"/>
    </pattern>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#252525"/></marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c53f32"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16835b"/></marker>
  </defs>
  <rect width="920" height="560" rx="12" fill="#faf8ef"/>
  <rect width="920" height="560" rx="12" fill="url(#grid)"/>
  <line x1="90" y1="455" x2="830" y2="455" stroke="#252525" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <line x1="190" y1="520" x2="190" y2="50" stroke="#252525" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <line x1="190" y1="455" x2="430" y2="315" stroke="#c53f32" stroke-width="5" marker-end="url(#red-arrow)"/>
  <line x1="190" y1="455" x2="350" y2="235" stroke="#1769aa" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <line x1="430" y1="315" x2="590" y2="95" stroke="#1769aa" stroke-width="3" stroke-dasharray="11 9" marker-end="url(#blue-arrow)"/>
  <line x1="350" y1="235" x2="590" y2="95" stroke="#c53f32" stroke-width="3" stroke-dasharray="11 9" marker-end="url(#red-arrow)"/>
  <line x1="190" y1="455" x2="590" y2="95" stroke="#16835b" stroke-width="6" marker-end="url(#green-arrow)"/>
  <circle cx="190" cy="455" r="6" fill="#252525"/>
  <circle cx="430" cy="315" r="7" fill="#c53f32"/>
  <circle cx="350" cy="235" r="7" fill="#1769aa"/>
  <circle cx="590" cy="95" r="8" fill="#16835b"/>
  <text x="838" y="473" font-family="Arial, sans-serif" font-size="24" fill="#b13b2e">Re z</text>
  <text x="150" y="43" font-family="Arial, sans-serif" font-size="24" fill="#b13b2e">Im z</text>
  <text x="166" y="487" font-family="Arial, sans-serif" font-size="22" fill="#252525">O</text>
  <text x="448" y="335" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#c53f32">z = (x, y)</text>
  <text x="218" y="215" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#1769aa">w = (a, b)</text>
  <text x="610" y="88" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#16835b">z + w</text>
  <text x="610" y="118" font-family="Arial, sans-serif" font-size="21" fill="#16835b">(x + a, y + b)</text>
  <text x="535" y="515" font-family="Arial, sans-serif" font-size="20" fill="#5b574d">regola del parallelogramma</text>
</svg>
