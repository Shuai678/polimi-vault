<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Numero complesso come punto e vettore</title>
  <desc id="desc">Il numero z uguale x più iy è rappresentato dal punto di coordinate x e y e dal vettore che parte dall'origine.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ded8c7" stroke-width="1"/>
    </pattern>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#252525"/>
    </marker>
    <marker id="vector-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/>
    </marker>
  </defs>
  <rect width="920" height="520" rx="12" fill="#faf8ef"/>
  <rect width="920" height="520" rx="12" fill="url(#grid)"/>
  <line x1="90" y1="390" x2="830" y2="390" stroke="#252525" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <line x1="250" y1="470" x2="250" y2="55" stroke="#252525" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <line x1="250" y1="390" x2="650" y2="150" stroke="#1769aa" stroke-width="5" marker-end="url(#vector-arrow)"/>
  <line x1="650" y1="150" x2="650" y2="390" stroke="#3089c8" stroke-width="2.5" stroke-dasharray="10 9"/>
  <line x1="250" y1="150" x2="650" y2="150" stroke="#3089c8" stroke-width="2.5" stroke-dasharray="10 9"/>
  <circle cx="250" cy="390" r="6" fill="#252525"/>
  <circle cx="650" cy="150" r="8" fill="#1769aa"/>
  <text x="838" y="408" font-family="Arial, sans-serif" font-size="24" fill="#b13b2e">Re z</text>
  <text x="210" y="48" font-family="Arial, sans-serif" font-size="24" fill="#b13b2e">Im z</text>
  <text x="226" y="422" font-family="Arial, sans-serif" font-size="22" fill="#252525">O</text>
  <text x="644" y="424" font-family="Arial, sans-serif" font-size="24" fill="#1769aa">x</text>
  <text x="210" y="158" font-family="Arial, sans-serif" font-size="24" fill="#1769aa">y</text>
  <text x="670" y="137" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#1769aa">P<tspan baseline-shift="sub" font-size="17">z</tspan> = (x, y)</text>
  <text x="455" y="235" font-family="Arial, sans-serif" font-size="26" font-style="italic" fill="#1769aa">z = x + iy</text>
  <text x="535" y="485" font-family="Arial, sans-serif" font-size="20" fill="#5b574d">asse reale</text>
  <text x="110" y="250" transform="rotate(-90 110 250)" font-family="Arial, sans-serif" font-size="20" fill="#5b574d">asse immaginario</text>
</svg>
